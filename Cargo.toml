[package]
name = "maxwell-deamon"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = { version = "0.9.3", features = ["zeroize"] }
aes-gcm = { version = "0.11.1", features = ["arrayvec", "bytes", "zeroize"] }
anyhow = "1.0.104"
argon2 = { version = "0.6.0", features = ["parallel", "zeroize"] }
base64 = "0.23.1"
chrono = "0.4.45"
ed25519-dalek = "3.0.0"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = { version = "0.11.0", features = ["zeroize"] }
subtle = "2.6.1"
thiserror = "2.0.20"
uuid = "1.26.0"
zeroize = { version = "1.9.0", features = ["derive", "simd"] }
